<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<title>Painel da noite</title>
<style>
html,body{margin:0;padding:0;background:#000;color:#eee;font-family:Segoe UI,Roboto,Arial,sans-serif;overflow:hidden;height:100%;-webkit-user-select:none;user-select:none}
#tela{padding:10px 14px;height:100vh;box-sizing:border-box;display:flex;flex-direction:column}
.cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#bba35a;font-size:18px;flex:none;gap:10px}
.cab b{color:#ffd400;font-size:24px}
.cab .estado{font-size:15px;color:#bba35a;text-align:right}
.cab .estado.ruim{color:#ff6b6b}
.lista{flex:1;min-height:0;column-count:3;column-gap:12px;column-fill:auto}
/* nao coube na tela? a pagina rola (colunas equilibradas, ordem mantida) */
html.rolar,html.rolar body{overflow-y:auto;height:auto;-webkit-overflow-scrolling:touch}
html.rolar #tela{height:auto;min-height:100vh}
html.rolar .corpo .lista{height:auto;column-fill:balance}
html.rolar .corpo{flex:none !important}
html.rolar .corpo .area{height:auto}
.lista.c1{column-count:1}.lista.c2{column-count:2}.lista.c3{column-count:3}.lista.c4{column-count:4}
.linha{display:grid;grid-template-columns:112px 1fr 112px 120px;align-items:center;gap:10px;background:#0c0c0c;border:1px solid #222;border-radius:10px;padding:6px 12px;min-height:56px;margin-bottom:8px;break-inside:avoid;-webkit-column-break-inside:avoid}
.linha.sumiu{opacity:.35}
.num{font-family:Consolas,Menlo,'Roboto Mono',monospace;font-size:40px;font-weight:bold;letter-spacing:1px;color:#fff}
.loja{display:flex;align-items:center;gap:12px;min-width:0}
.loja img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#222;flex:none}
.loja .sem{width:52px;height:52px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;flex:none}
.loja span{font-size:17px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-family:Consolas,Menlo,'Roboto Mono',monospace;font-size:21px;font-weight:bold;text-align:center;white-space:nowrap;border:2px solid #ffd400;color:#ffd400;background:#000;border-radius:8px;padding:7px 0}
.tm.estourou{background:#e11;border-color:#e11;color:#000}
.tm.feito{border-color:#2a2a2a;color:#666;font-size:16px}
.tm.nada{border-color:transparent}
.tm.espera{border-color:#3a7bd5;color:#8ab4ff;font-size:18px}
.loja .tx{display:flex;flex-direction:column;min-width:0;gap:3px}
.tg{display:flex;gap:3px;flex-direction:column;align-items:flex-start}   /* uma tag por linha (SITE / RETIRADA) */
.tag{font-style:normal;font-size:12px;font-weight:bold;letter-spacing:.5px;padding:1px 7px;border-radius:4px;align-self:flex-start;white-space:nowrap}
.tag.ag{background:#1f3b66;color:#cfe0ff}.tag.ret{background:#6a4a0c;color:#ffe1a6}.tag.tb{background:#e11;color:#fff}.tag.rp{background:#ff8c00;color:#000}.tag.cw{background:#59327a;color:#f4edf7;font-size:13px;padding:2px 8px}
.bt{font-size:19px;font-weight:bold;text-align:center;border-radius:8px;padding:9px 0;letter-spacing:1px;color:#fff}
.bt.preparo{background:#e67e22}.bt.pronto{background:#27ae60}.bt.saiu{background:#455;color:#cdd}.bt.cancelado{background:#8e2b2b}
.vazio{color:#6b6440;font-size:24px;padding:60px 20px;text-align:center}
.rodape{color:#6b6440;font-size:12px;margin-top:6px;flex:none;display:flex;justify-content:space-between;gap:10px}
.linha{user-select:none;-webkit-tap-highlight-color:transparent}
.linha.aberta{border-color:#ffd400}
.itens{grid-column:1/-1;border-top:1px dashed #444;padding:8px 2px 4px;display:flex;flex-direction:column;gap:8px}
.it{font-size:20px;color:#fff;line-height:1.25}.it b{color:#ffd400;margin-right:4px}
.it .op{font-size:15px;color:#bbb;margin:2px 0 0 30px}
.it .obs{font-size:16px;font-weight:bold;color:#000;background:#ffd400;border-radius:5px;padding:2px 8px;margin:4px 0 0 30px;display:inline-block}
.itens.nada{color:#788;font-size:15px}
.rodape a{color:#8a7d45}
.lista.c4 .num{font-size:32px}.lista.c4 .linha{grid-template-columns:92px 1fr 96px 104px}.lista.c4 .bt{font-size:16px}.lista.c4 .tm{font-size:18px}.lista.c4 .loja img,.lista.c4 .loja .sem{width:44px;height:44px}
/* tablet em pe ou tela estreita: menos colunas */
/* cada coluna precisa de ~560 px: tablet deitado (1280) = 2 colunas; em pe = 1 */
@media (max-width:1760px){ .lista.c3,.lista.c4{column-count:2} }
@media (max-width:1150px){ .lista.c2,.lista.c3,.lista.c4{column-count:1} }
@media (max-width:620px){ .num{font-size:32px} .linha{grid-template-columns:88px 1fr 92px 100px} .loja span{display:none} }
/* tela de configuracao */
#config{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:5}
#config[hidden],[hidden]{display:none!important}
/* Tela de Entregadores: linhas dos agrupados (por baixo dos cartoes) */
.area{flex:1;min-height:0;position:relative}
.area .lista{position:relative;z-index:1}
.area svg.lig{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
.area svg.lig path{fill:none;stroke-width:2;stroke-opacity:.7;stroke-linejoin:round;stroke-linecap:round}
/* ===== TELA DE ENTREGADORES (aprovado em 02/10): sem logomarca, numero grande, 4 colunas =====
   Os TAMANHOS (numero, timer, botao, vaos) sao gerados por JS em proporcao a largura da tela
   (f = largura/1920) — ver cssEntregadores(). Aqui fica so o que nao depende de tamanho. */
body.ent .loja span,body.ent .loja img,body.ent .loja .sem{display:none}   /* sem nome e sem logomarca */
body.ent .loja{gap:0}
body.ent .rodape{display:none}   /* sem o rodape cabe mais uma linha de pedidos */
/* 23.7: DIA = tela dividida: iFood a esquerda (2 colunas), rotas da Saipos a direita */
body.ent .meio{display:flex;gap:16px;flex:1;min-height:0;height:100%}
body.ent .meio .area{flex:1;min-width:0}
body.ent .meio .rotasArea{flex:1;min-width:0;border-left:1px solid #222;padding-left:14px;overflow:hidden;display:flex;flex-direction:column}
body.ent .rotasTit{color:#bba35a;font-size:13px;letter-spacing:1px;margin:0 0 6px 2px;flex:none}
body.ent .rotasLista{flex:1;min-height:0;column-count:2;column-gap:14px;column-fill:auto}
body.ent .rota{background:#0c0c0c;border:1px solid #2a2a2a;border-radius:10px;padding:8px 12px 10px;margin-bottom:10px;break-inside:avoid;-webkit-column-break-inside:avoid}
body.ent .rota.saiu{border-color:#1f6b3a}
body.ent .rota .topo{display:flex;align-items:center;justify-content:space-between;gap:10px}
body.ent .nrota{font-family:Consolas,Menlo,'Roboto Mono',monospace;font-weight:bold;color:#fff;white-space:nowrap}
body.ent .nrota small{font-family:Segoe UI,Arial,sans-serif;color:#bba35a;font-weight:normal;margin-right:6px;letter-spacing:1px}
body.ent .st{font-weight:bold;border-radius:8px;text-align:right;white-space:nowrap}
body.ent .st.espera{background:#3a3a3a;color:#ddd}body.ent .st.ok{background:#1f6b3a;color:#fff}
body.ent .st .ha{display:block;font-weight:normal;color:#bbb}body.ent .st.ok .ha{color:#bfe8cc}
body.ent .peds{border-top:1px dashed #333;display:flex;flex-direction:column}
body.ent .ped{display:flex;align-items:baseline}
body.ent .ped .n{font-family:Consolas,Menlo,'Roboto Mono',monospace;font-weight:bold;color:#ffd400}
body.ent .ped .b{color:#ddd}body.ent .ped .b small{color:#888;font-size:70%}
body.ent .ped.entregue{opacity:.4}body.ent .ped.entregue .b{text-decoration:line-through}
body.ent .rvazio{color:#6b6440;padding:30px 10px;text-align:center}
body.ent .lista.e1{column-count:1}body.ent .lista.e2{column-count:2}body.ent .lista.e3{column-count:3}body.ent .lista.e4{column-count:4}
.qualTela{color:#788;font-size:13px;margin-left:8px}
#config .caixa{width:min(560px,92vw);background:#0c0c0c;border:1px solid #333;border-radius:14px;padding:22px 24px;color:#ddd;font-size:16px}
#config h1{color:#ffd400;font-size:24px;margin:0 0 6px}
#config p{color:#999;margin:6px 0 14px;line-height:1.4}
#config label{display:block;margin:12px 0 4px;color:#bba35a}
#config input{width:100%;box-sizing:border-box;font-size:20px;padding:10px 12px;border-radius:8px;border:1px solid #444;background:#000;color:#fff}
#config button{margin-top:18px;width:100%;font-size:20px;font-weight:bold;padding:12px;border:0;border-radius:10px;background:#ffd400;color:#000}
#config small{display:block;color:#777;margin-top:10px}
</style>
</head>
<body>
<div id="tela"></div>
<div id="config" hidden>
  <div class="caixa">
    <h1>🌙 Painel da noite</h1>
    <p>Este tablet mostra os pedidos que o computador do Gestor de Pedidos (com o Escravo Virtual) envia pela sala de sincronização.</p>
    <label for="inSala">Sala (a mesma do "Sincronizar entre PCs")</label>
    <input id="inSala" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="a sala do Escravo (Compartilhar o histórico)">
    <label for="inToken">Token do ntfy (opcional)</label>
    <input id="inToken" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="tk_... (deixe vazio se não usa)">
    <label for="inTela">Qual tela</label>
    <select id="inTela" style="width:100%;font-size:20px;padding:10px 12px;border-radius:8px;border:1px solid #444;background:#000;color:#fff">
      <option value="kds">KDS — cozinha (com os itens do pedido)</option>
      <option value="entregadores">Tela de Entregadores (sem itens, com os agrupados ligados)</option>
    </select>
    <button id="btSalvar">Começar</button>
    <small>Para voltar a esta tela depois, toque 5 vezes seguidas no relógio.</small>
  </div>
</div>

  // Tambem aceita o link com #sala=nome-da-sala
  // ---------------------------------------------------------------
  var LS_SALA = 'painelNoite.sala', LS_TOKEN = 'painelNoite.token', LS_ESTADO = 'painelNoite.estado';
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var mh = (location.hash || '').match(/sala=([^&]+)/);
  if (mh) lsSet(LS_SALA, decodeURIComponent(mh[1]));
  // QUAL TELA: KDS (cozinha, com itens) ou ENTREGADORES (sem itens, com os
  // agrupados ligados). Vem do endereco (#tela=entregadores) ou da configuracao.
  var LS_TELA = 'painelNoite.tela';
  var mtl = (location.hash || '').match(/tela=([a-z]+)/i);
  if (mtl) lsSet(LS_TELA, /entregador/i.test(mtl[1]) ? 'entregadores' : 'kds');
  // pagina do GitHub: esta e a TELA KDS. O #tela= no endereco pode trocar
  // so nesta abertura; a escolha guardada no aparelho nao vale aqui.
  var TELA_ENT = mtl ? /entregador/i.test(mtl[1]) : false;
  // trocar so o #sala= / #tela= no endereco (sem recarregar) tambem vale
  window.addEventListener('hashchange', function () { if (/sala=|tela=/.test(location.hash || '')) location.reload(); });
  function normSala(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, '-'); }
  var sala = normSala(lsGet(LS_SALA));
  var token = String(lsGet(LS_TOKEN) || '').trim();

  var elTela = document.getElementById('tela');
  var elConfig = document.getElementById('config');
  function abrirConfig() {
    document.getElementById('inSala').value = sala;
    document.getElementById('inToken').value = token;
    document.getElementById('inTela').value = TELA_ENT ? 'entregadores' : 'kds';
    elConfig.hidden = false;
  }
  document.getElementById('btSalvar').addEventListener('click', function () {
    var s = normSala(document.getElementById('inSala').value);
    if (!s) { document.getElementById('inSala').focus(); return; }
    lsSet(LS_SALA, s);
    lsSet(LS_TOKEN, String(document.getElementById('inToken').value || '').trim());
    lsSet(LS_TELA, document.getElementById('inTela').value === 'entregadores' ? 'entregadores' : 'kds');
    location.hash = '';
    location.reload();
  });

  // ---------------------------------------------------------------
  // LOGOMARCAS (as 5 pizzarias vem dentro da pagina; as outras lojas
  // usam a logomarca do iFood em 300x300)
  // ---------------------------------------------------------------
  function normLoja(n) {
    var x = String(n || '').toLowerCase();
    try { x = x.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) {}
    return x.replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
  }
  function logoDaLoja(nome) {
    var alvo = normLoja(nome), k;
    for (k in LOGOS_EMBUTIDAS) { if (normLoja(k) === alvo) return LOGOS_EMBUTIDAS[k]; }
    for (k in LOGOS_IFOOD) { if (normLoja(k) === alvo) return 'https://static-images.ifood.com.br/image/upload/t_low/' + LOGOS_IFOOD[k]; }
    return '';
  }

  // ---------------------------------------------------------------
  // ESTADO: os pedidos que o PC mandou (guardado tambem no tablet,
  // para uma recarga nao zerar a tela)
  // ---------------------------------------------------------------
  var estado = { pedidos: {}, so: 1, col: 3, ultimoPC: 0, vistos: {}, rotas: null };
  var rotasNomeEm = {};   // 23.7: rota -> quando o nome do entregador apareceu (some 30 s depois)
  try {
    var salvo = JSON.parse(lsGet(LS_ESTADO) || 'null');
    if (salvo && salvo.sala === sala && salvo.pedidos) { estado.pedidos = salvo.pedidos; estado.so = salvo.so; estado.col = salvo.col; estado.dia = salvo.dia ? 1 : 0; estado.ultimoPC = salvo.ultimoPC || 0; estado.desvioSalvo = salvo.desvio || 0; estado.rotas = salvo.rotas || null; }
  } catch (e) {}
  var salvarPendente = false;
  function salvarEstado() {
    if (salvarPendente) return;
    salvarPendente = true;
    setTimeout(function () {
      salvarPendente = false;
      lsSet(LS_ESTADO, JSON.stringify({ sala: sala, pedidos: estado.pedidos, so: estado.so, col: estado.col, dia: estado.dia ? 1 : 0, ultimoPC: estado.ultimoPC, desvio: desvio, rotas: estado.rotas }));
    }, 1500);
  }

  // ACERTO DO RELOGIO: o tablet pode estar com a hora diferente do PC.
  // O servidor do ntfy carimba a hora de cada mensagem (time), entao:
  //   desvio (tablet - PC) = (tablet - servidor) + (servidor - PC)
  // tablet-servidor vem dos sinais ao vivo (open/keepalive), e
  // servidor-PC de cada mensagem (hora que o PC escreveu vs carimbo).
  // Fica a menor diferenca de cada lado (= menor atraso de rede).
  var minTabServ = null, minServPC = null, desvio = estado.desvioSalvo || 0;   // comeca com o da ultima vez
  function recalcDesvio() {
    if (minTabServ === null || minServPC === null) return;
    var d = minTabServ + minServPC;
    desvio = Math.abs(d) < 6 * 3600000 ? d : 0;
  }
  function amostraTabServ(tempoServidorSeg) {
    if (!tempoServidorSeg) return;
    var d = Date.now() - tempoServidorSeg * 1000 - 500;          // "time" vem em segundos inteiros
    if (minTabServ === null || d < minTabServ) { minTabServ = d; recalcDesvio(); }
  }
  function amostraServPC(tsPC, tempoServidorSeg) {
    if (!tsPC || !tempoServidorSeg) return;
    var d = tempoServidorSeg * 1000 + 500 - tsPC;
    if (minServPC === null || d < minServPC) { minServPC = d; recalcDesvio(); }
  }
  function agoraPC() { return Date.now() - desvio; }

  // aplica uma mensagem do PC
  function aplicar(msg, tempoServidorSeg) {
    if (!msg || msg.t !== 'noite') return;
    if (msg.id) { if (estado.vistos[msg.id]) return; estado.vistos[msg.id] = 1; }
    amostraServPC(msg.ts, tempoServidorSeg);
    if (msg.ts > estado.ultimoPC) { estado.ultimoPC = msg.ts; estado.so = msg.so; estado.col = msg.col || 3; estado.dia = msg.dia ? 1 : 0; }
    if (Array.isArray(msg.rt) && (!estado.rotas || msg.ts >= (estado.rotas.ts || 0))) estado.rotas = { ts: msg.ts, lista: msg.rt };   // 23.7: rotas da Saipos (DIA)
    (msg.p || []).forEach(function (c) {
      if (!c || !c.n) return;
      var atual = estado.pedidos[c.n];
      if (atual && (atual._ts || 0) > msg.ts) return;      // ja tenho uma versao mais nova
      c._ts = msg.ts;
      if (!c.it && atual && atual.it) c.it = atual.it;   // os itens vem uma vez so
      estado.pedidos[c.n] = c;
    });
    // limpeza: mais de 8 h, ou fora da cozinha ha mais de 30 min
    var ag = agoraPC();
    Object.keys(estado.pedidos).forEach(function (n) {
      var r = estado.pedidos[n];
      if ((r.i || r.a || 0) && ag - (r.i || r.a) > 8 * 3600000) delete estado.pedidos[n];
      else if (r.z && ag - r.z > 30 * 60000) delete estado.pedidos[n];
    });
    salvarEstado();
    desenhar();
  }

  // ---------------------------------------------------------------
  // CONEXAO: escuta a sala no ntfy.sh e no servidor reserva ao mesmo
  // tempo (o PC usa o reserva quando o ntfy.sh recusa). Na primeira
  // conexao pega as ultimas 6 h; depois, so o que chegou desde a
  // ultima mensagem recebida.
  // ---------------------------------------------------------------
  var SERVIDORES = ['https://ntfy.sh', 'https://ntfy.envs.net'];
  var conexoes = {};
  var ultimaAtividade = 0, statusConexao = 'conectando…';
  function urlSSE(srv) {
    var c = conexoes[srv] || {};
    var since = c.ultimoId || '6h';
    var u = srv + '/' + encodeURIComponent(sala + '-noite-ev') + '/sse?since=' + encodeURIComponent(since);
    if (token && srv === 'https://ntfy.sh') {
      try { u += '&auth=' + btoa('\u0000user\u0000' + token).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); } catch (e) {}
    }
    return u;
  }
  function conectar(srv) {
    var c = conexoes[srv] = conexoes[srv] || { erros: 0 };
    if (c.es) { try { c.es.close(); } catch (e) {} }
    var es;
    try { es = new EventSource(urlSSE(srv)); } catch (e) { return agendar(srv); }
    c.es = es;
    es.onopen = function () { c.erros = 0; c.aberto = true; ultimaAtividade = Date.now(); atualizarStatus(); };
    es.onmessage = function (ev) {
      ultimaAtividade = Date.now();
      var env = null; try { env = JSON.parse(ev.data); } catch (e) { return; }
      if (!env || env.event !== 'message') return;
      if (env.id) c.ultimoId = env.id;
      var msg = null; try { msg = JSON.parse(env.message); } catch (e) { return; }
      aplicar(msg, env.time);
    };
    function sinalAoVivo(ev) {
      ultimaAtividade = Date.now();
      try { var d = JSON.parse(ev.data); amostraTabServ(d.time); } catch (e) {}
    }
    es.addEventListener('keepalive', sinalAoVivo);
    es.addEventListener('open', sinalAoVivo);
    es.onerror = function () {
      c.aberto = false;
      try { es.close(); } catch (e) {}
      c.es = null;
      c.erros++;
      atualizarStatus();
      agendar(srv);
    };
  }
  function agendar(srv) {
    var c = conexoes[srv];
    var espera = Math.min(120000, 5000 * Math.pow(2, Math.min(c.erros || 0, 5)));   // 5 s, 10 s, 20 s ... 2 min
    clearTimeout(c.timer);
    c.timer = setTimeout(function () { conectar(srv); }, espera);
  }
  function atualizarStatus() {
    var abertos = SERVIDORES.filter(function (s) { return conexoes[s] && conexoes[s].aberto; }).length;
    statusConexao = abertos ? 'conectado' : 'sem conexão com a internet/servidor — tentando de novo';
    desenharCabecalho();
  }
  // vigia: conexao sem sinal (nem keepalive) ha mais de 2 min = religa
  setInterval(function () {
    if (!sala) return;
    if (ultimaAtividade && Date.now() - ultimaAtividade > 120000) {
      ultimaAtividade = Date.now();
      SERVIDORES.forEach(conectar);
    }
  }, 20000);
  // tela voltou (tablet acordou): confere a conexao
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { SERVIDORES.forEach(function (s) { if (!conexoes[s] || !conexoes[s].aberto) conectar(s); }); pedirTelaAcesa(); }
  });

  // ---------------------------------------------------------------
  // A TELA (igual ao painel da noite do computador)
  // ---------------------------------------------------------------
  function rotulo(e) { return e === 'pronto' ? 'PRONTO' : (e === 'rota' || e === 'fim') ? 'SAIU' : e === 'cancelado' ? 'CANCELADO' : 'PREPARO'; }
  function classe(e) { return e === 'pronto' ? 'pronto' : (e === 'rota' || e === 'fim') ? 'saiu' : e === 'cancelado' ? 'cancelado' : 'preparo'; }
  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function horaDoTs(ts) { var d = new Date(ts); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function textoTimer(rest) {
    rest = Math.round(rest);
    if (rest > 60) return Math.ceil(rest / 60) + ' min';
    if (rest >= -60) return rest + ' seg';
    return '-' + Math.floor(-rest / 60) + ' min';
  }
  var META_S = 7 * 60;
  // DIA + entrega propria = metade do prazo do cartao do Gestor ("Entregar em 30min" -> 15 min)
  function metaDe(r) {
    if (r.cw && Number(r.pz) > 0) return Number(r.pz) * 60;   // 23.6: pedido do site = tempo de preparo original
    if (estado.dia && r.md === 'propria' && Number(r.pz) > 0) return Math.max(60, Math.ceil(Number(r.pz) / 2) * 60);
    return META_S;
  }
  // 23.4: das 16h as 5h so pizzaria (as lojas do almoco somem do KDS as 16h)
  function lojaDoAlmoco(nome) { return !/pizza/i.test(String(nome || '')); }
  function horaSoPizza() { var h = new Date().getHours(); return h >= 16 || h < 5; }
  function listaVisivel() {
    var ag = agoraPC(), lista = [];
    var soPizza = horaSoPizza();
    Object.keys(estado.pedidos).forEach(function (n) {
      var r = estado.pedidos[n];
      // DIA ligado no Gestor: o KDS mostra todos os pedidos; a Tela de Entregadores so entrega iFood, sempre
      var filtraIfood = TELA_ENT || (!estado.dia && estado.so !== 0);
      if (filtraIfood && r.md === 'propria') return;
      if (soPizza && lojaDoAlmoco(r.l)) return;   // 23.4: depois das 16h so pizzaria
      var fora = (r.e === 'rota' || r.e === 'fim' || r.e === 'cancelado');
      if (r.e === 'rota' || r.e === 'fim') return;   // saiu para entrega: some na hora
      if (!TELA_ENT && r.e === 'pronto') return;      // KDS: marcou PRONTO = some na hora (a cozinha ja acabou)
      if (fora && ag - (r.m || 0) > 90000) return;
      if (r.z && ag - r.z > 90000) return;
      lista.push(r);
    });
    lista.sort(function (a, b) { return (a.a || 0) - (b.a || 0) || String(a.n).localeCompare(String(b.n)); });
    return lista;
  }
  var ultimoHtml = '';
  var abertos = {};   // pedidos expandidos (toque na linha)
  // LIGACOES DOS PEDIDOS AGRUPADOS (Tela de Entregadores)
  // ------------------------------------------------------------------
  // Desenha, por baixo dos cartoes, linhas finas ligando os pedidos do
  // mesmo grupo do iFood. Regras (pedido do Breno, 01/10):
  //  - a ordem dos cartoes NUNCA muda; a linha vai ate o par onde ele estiver
  //  - as linhas NAO se cruzam: cada ligacao escolhe o caminho livre
  //    (margem esquerda, margem direita / vao entre colunas, pista mais
  //    para fora, altura de encaixe um pouco acima/abaixo do meio)
  //  - cada grupo tem uma COR (o primeiro e amarelo)
  // Uso: desenharLigacoes(areaEl, svgEl, listaEl) — os cartoes do grupo
  // tem data-g="<id do grupo>". Devolve { cruzamentos: n } para conferencia.
  var LIGACOES_CORES = ['#ffd400', '#4fc3f7', '#ff6fb5', '#7ee081', '#ffa94d', '#b39dff', '#e8e8e8', '#ff5252'];
  function desenharLigacoes(area, svg, lista) {
    var base = area.getBoundingClientRect();
    var grupos = {}, ordemG = [];
    var cartoes = lista.querySelectorAll('[data-g]');
    for (var i = 0; i < cartoes.length; i++) {
      var el = cartoes[i], g = el.getAttribute('data-g');
      var r = el.getBoundingClientRect();
      if (!grupos[g]) { grupos[g] = []; ordemG.push(g); }
      grupos[g].push({ x: r.left - base.left, r: r.right - base.left, y: r.top - base.top + r.height / 2, h: r.height });
    }
    // colunas (pelo x de cada cartao)
    var xsCol = [];
    var todos = lista.querySelectorAll('.linha');
    for (var j = 0; j < todos.length; j++) {
      var xx = Math.round(todos[j].getBoundingClientRect().left - base.left);
      if (!xsCol.some(function (v) { return Math.abs(v - xx) < 5; })) xsCol.push(xx);
    }
    xsCol.sort(function (a, b) { return a - b; });
    // as ligacoes: cada par vizinho dentro do grupo
    var lig = [];
    ordemG.forEach(function (g, gi) {
      var m = grupos[g];
      for (var k = 0; k < m.length - 1; k++) lig.push({ g: g, cor: LIGACOES_CORES[gi % LIGACOES_CORES.length], a: m[k], b: m[k + 1] });
    });
    // as mais curtas primeiro (ficam por dentro); as compridas por fora
    lig.sort(function (p, q) { return Math.abs(p.a.y - p.b.y) - Math.abs(q.a.y - q.b.y); });
    var PASSO = 7, PRIMEIRA = 8, DESVIOS = [0, -12, 12];
    function conflita(s, t) {
      if (s.g === t.g) return false;
      var tol = 3;
      if (s.o === 'h' && t.o === 'h') return Math.abs(s.y - t.y) < tol && Math.min(s.x2, t.x2) > Math.max(s.x1, t.x1) - tol;
      if (s.o === 'v' && t.o === 'v') return Math.abs(s.x - t.x) < tol && Math.min(s.y2, t.y2) > Math.max(s.y1, t.y1) - tol;
      var h = s.o === 'h' ? s : t, v = s.o === 'h' ? t : s;
      return v.x > h.x1 - tol && v.x < h.x2 + tol && h.y > v.y1 - tol && h.y < v.y2 + tol;
    }
    function H(g, y, xa, xb) { return { g: g, o: 'h', y: y, xa: xa, xb: xb, x1: Math.min(xa, xb), x2: Math.max(xa, xb) }; }
    function V(g, x, ya, yb) { return { g: g, o: 'v', x: x, y1: Math.min(ya, yb), y2: Math.max(ya, yb) }; }
    function candidatos(L) {
      var a = L.a, b = L.b, g = L.g, lst = [];
      var mesma = Math.abs(a.x - b.x) < 5;
      for (var n = 0; n < 7; n++) {
        DESVIOS.forEach(function (dy) {
          var ya = a.y + dy, yb = b.y + dy;
          if (mesma) {
            var xl = a.x - PRIMEIRA - n * PASSO;                 // margem esquerda
            lst.push({ custo: n * 3 + (dy ? 1 : 0), seg: [H(g, ya, a.x, xl), V(g, xl, ya, yb), H(g, yb, xl, b.x)],
                       d: 'M' + a.x + ' ' + ya + 'H' + xl + 'V' + yb + 'H' + b.x });
            var xr = a.r + PRIMEIRA + n * PASSO;                 // margem direita
            lst.push({ custo: n * 3 + 2 + (dy ? 1 : 0), seg: [H(g, ya, a.r, xr), V(g, xr, ya, yb), H(g, yb, xr, b.r)],
                       d: 'M' + a.r + ' ' + ya + 'H' + xr + 'V' + yb + 'H' + b.r });
          } else {
            var esq = a.x < b.x ? a : b, dir = a.x < b.x ? b : a;
            var ye = esq.y + dy, yd = dir.y + dy;
            var xv = dir.x - PRIMEIRA - n * PASSO;               // pelo vao antes da coluna da direita
            if (xv > esq.r + 2) lst.push({ custo: n * 3 + (dy ? 1 : 0), seg: [H(g, ye, esq.r, xv), V(g, xv, ye, yd), H(g, yd, xv, dir.x)],
                       d: 'M' + esq.r + ' ' + ye + 'H' + xv + 'V' + yd + 'H' + dir.x });
            var xv2 = esq.r + PRIMEIRA + n * PASSO;              // pelo vao logo depois da coluna da esquerda
            if (xv2 < dir.x - 2) lst.push({ custo: n * 3 + 1 + (dy ? 1 : 0), seg: [H(g, ye, esq.r, xv2), V(g, xv2, ye, yd), H(g, yd, xv2, dir.x)],
                       d: 'M' + esq.r + ' ' + ye + 'H' + xv2 + 'V' + yd + 'H' + dir.x });
          }
        });
      }
      lst.sort(function (p, q) { return p.custo - q.custo; });
      return lst;
    }
    // Tenta varias ordens de encaixe e fica com a que da MENOS cruzamentos
    // (empate: o caminho mais curto/por dentro). Sao poucas ligacoes, e rapido.
    function encaixar(ordem) {
      var pst = [], esc = [], cz = 0, custoT = 0;
      ordem.forEach(function (L) {
        var cs = candidatos(L), melhor = null, menos = 1e9;
        for (var c = 0; c < cs.length; c++) {
          var n = 0;
          cs[c].seg.forEach(function (s) { pst.forEach(function (t) { if (conflita(s, t)) n++; }); });
          if (n === 0) { melhor = cs[c]; menos = 0; break; }
          if (n < menos) { menos = n; melhor = cs[c]; }
        }
        if (!melhor) return;
        cz += menos; custoT += melhor.custo;
        melhor.seg.forEach(function (s) { pst.push(s); });
        esc.push({ cor: L.cor, seg: melhor.seg, g: L.g });
      });
      return { pst: pst, esc: esc, cz: cz, custo: custoT };
    }
    var semente = 7;
    function aleat() { semente = (semente * 9301 + 49297) % 233280; return semente / 233280; }   // sempre o mesmo desenho
    var ordens = [lig.slice(), lig.slice().reverse()];
    for (var t = 0; t < 40 && lig.length > 1; t++) {
      var o = lig.slice();
      for (var q = o.length - 1; q > 0; q--) { var w = Math.floor(aleat() * (q + 1)); var tmp = o[q]; o[q] = o[w]; o[w] = tmp; }
      ordens.push(o);
    }
    var best = null;
    ordens.forEach(function (o) {
      var r = encaixar(o);
      if (!best || r.cz < best.cz || (r.cz === best.cz && r.custo < best.custo)) best = r;
    });
    var postos = best ? best.pst : [], escolhidos = best ? best.esc : [], cruz = best ? best.cz : 0;
    // Quando o cruzamento e INEVITAVEL (dois grupos "entrelacados" entre as
    // mesmas duas colunas), a linha horizontal passa por cima da outra com
    // uma PONTE (um arquinho), para nao parecer que as duas se ligam.
    var R = 5, paths = '', pontes = 0;
    escolhidos.forEach(function (E) {
      var d = '';
      E.seg.forEach(function (s, k) {
        if (s.o === 'v') { d += 'V' + E.seg[2].y; return; }
        var dir = s.xb >= s.xa ? 1 : -1;
        if (k === 0) d += 'M' + s.xa + ' ' + s.y;
        var cortes = postos.filter(function (t) { return t.o === 'v' && t.g !== E.g && t.x > s.x1 + R && t.x < s.x2 - R && s.y > t.y1 + 1 && s.y < t.y2 - 1; })
          .map(function (t) { return t.x; }).sort(function (a, b) { return (a - b) * dir; });
        cortes.forEach(function (x) {
          d += 'H' + (x - R * dir) + 'A' + R + ' ' + R + ' 0 0 ' + (dir > 0 ? 1 : 0) + ' ' + (x + R * dir) + ' ' + s.y;
          pontes++;
        });
        d += 'H' + s.xb;
      });
      paths += '<path stroke="' + E.cor + '" d="' + d + '"/>';
    });
    svg.innerHTML = paths;
    return { cruzamentos: cruz, ligacoes: lig.length, pontes: pontes };
  }

  function ligarAgrupados() {
    try {
      var area = elTela.querySelector('.area'), svg = area && area.querySelector('svg.lig'), lst = area && area.querySelector('.lista');
      if (area && svg && lst) desenharLigacoes(area, svg, lst);
    } catch (e) {}
  }
  window.addEventListener('resize', function () { if (TELA_ENT) { ultimoHtml = ''; try { desenhar(); } catch (e) {} ligarAgrupados(); } });
  function htmlItens(its) {
    if (!its || !its.length) return '<div class="itens nada">itens ainda não recebidos</div>';
    return '<div class="itens">' + its.map(function (x) {
      return '<div class="it"><b>' + esc(x[0]) + 'x</b>' + esc(x[1]) +
             (x[2] ? '<div class="op">' + esc(x[2]) + '</div>' : '') +
             (x[3] ? '<div class="obs">⚠ ' + esc(x[3]) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  function desenharCabecalho() {
    var cab = elTela.querySelector('.cab');
    if (!cab) return;
    var lista = listaVisivel();
    var emPreparo = lista.filter(function (r) { return r.e === 'preparo'; }).length;
    var prontos = lista.filter(function (r) { return r.e === 'pronto'; }).length;
    if (!TELA_ENT) {   // KDS: os prontos nao aparecem na lista, mas o contador segue valendo
      prontos = 0;
      var soPz = horaSoPizza();
      Object.keys(estado.pedidos).forEach(function (n) { var r = estado.pedidos[n]; if (r && r.e === 'pronto' && !r.z && !(estado.so !== 0 && !estado.dia && r.md === 'propria') && !(soPz && lojaDoAlmoco(r.l))) prontos++; });
    }
    var d = new Date();
    var hora = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    // o PC manda um sinal a cada 5 min enquanto ha pedido na cozinha
    var semPC = estado.ultimoPC ? Math.round((agoraPC() - estado.ultimoPC) / 60000) : null;
    var ativos = emPreparo + prontos > 0;
    var estadoTxt, ruim = false;
    if (statusConexao !== 'conectado') { estadoTxt = statusConexao; ruim = true; }
    else if (ativos && semPC !== null && semPC >= 11) { estadoTxt = '⚠️ sem notícias do computador do Gestor há ' + semPC + ' min'; ruim = true; }
    else estadoTxt = 'ao vivo';
    var h = '<span><b class="relogio">' + hora + '</b><span class="qualTela">' + (TELA_ENT ? '🛵 ENTREGADORES' : '🍳 KDS') + '</span> &nbsp; 🔥 ' + emPreparo + ' em preparo &nbsp; ✅ ' + prontos + ' prontos' +
            ((TELA_ENT || (!estado.dia && estado.so !== 0)) ? ' &nbsp; <small style="color:#788">só entrega iFood</small>' : (estado.dia ? ' &nbsp; <small style="color:#788">DIA: todos os pedidos</small>' : '')) +
            (TELA_ENT ? ' &nbsp; <small style="color:#566">tela ' + window.innerWidth + '×' + window.innerHeight + '</small>' : '') + '</span>' +
            '<span class="estado' + (ruim ? ' ruim' : '') + '">' + esc(estadoTxt) + '</span>';
    if (cab.innerHTML !== h) cab.innerHTML = h;
  }
  // 23.2: CSS da Tela de Entregadores em proporcao a largura da tela.
  // Em 1920px f = 1 (igual a simulacao aprovada); em 1280px f = 0,66.
  function cssEntregadores(f, sel) {
    sel = sel || 'body.ent';
    function p(v) { return (Math.round(v * f * 10) / 10) + 'px'; }
    return sel + ' .lista{column-gap:' + p(18) + ';padding-right:' + p(18) + '}' +
      sel + ' .linha{margin-left:' + p(22) + ';grid-template-columns:' + p(140) + ' minmax(' + p(66) + ',1fr) ' + p(86) + ' ' + p(92) + ';gap:' + p(8) + ';padding:' + p(6) + ' ' + p(10) + ';margin-bottom:' + p(8) + ';min-height:0;border-radius:' + p(10) + '}' +
      sel + ' .num{font-size:' + p(64) + ';line-height:' + p(52) + ';letter-spacing:' + p(-4) + '}' +
      sel + ' .tag{font-size:' + Math.max(8, Math.round(10 * f)) + 'px;padding:1px ' + p(4) + ';letter-spacing:.3px}' +   /* 23.9: tags maiores */
      sel + ' .tag.cw{font-size:' + Math.max(9, Math.round(14 * f)) + 'px;padding:' + p(2) + ' ' + p(7) + ';letter-spacing:.5px}' +   /* 23.9: SITE legivel na TV */
      sel + ' .tm{font-size:' + p(20) + ';padding:' + p(7) + ' 0;border-radius:' + p(8) + '}' +
      sel + ' .tm.espera{font-size:' + p(18) + '}' + sel + ' .tm.feito{font-size:' + p(14) + ';letter-spacing:-.5px}' +
      sel + ' .bt{font-size:' + p(18) + ';letter-spacing:.5px;padding:' + p(9) + ' 0;border-radius:' + p(8) + '}' +
      sel + ' .area svg.lig path{stroke-width:' + Math.max(1.2, 2 * f) + '}' +
      // 23.7: rotas da Saipos (metade direita no DIA)
      sel + ' .nrota{font-size:' + p(30) + '}' + sel + ' .nrota small{font-size:' + p(14) + '}' +
      sel + ' .st{font-size:' + p(15) + ';padding:' + p(6) + ' ' + p(10) + '}' + sel + ' .st .ha{font-size:' + p(12) + '}' +
      sel + ' .peds{margin-top:' + p(8) + ';padding-top:' + p(6) + ';gap:' + p(4) + '}' +
      sel + ' .ped{gap:' + p(12) + ';font-size:' + p(20) + '}' + sel + ' .ped .n{min-width:' + p(64) + '}' +
      sel + ' .rvazio{font-size:' + p(20) + '}';
  }
  var escalaEntAtual = '';
  function aplicarEscalaEnt(lg, nCol) {
    try {
      // 4 colunas de ~473px cabem em 1920 (f=1); a partir dai tudo encolhe junto com a tela
      var f = Math.min(1, Math.max(0.45, (lg - 28) / (473 * nCol)));
      var chave = f.toFixed(3) + '/' + nCol;
      if (chave === escalaEntAtual) return;
      escalaEntAtual = chave;
      var st = document.getElementById('escalaEnt');
      if (!st) { st = document.createElement('style'); st.id = 'escalaEnt'; document.head.appendChild(st); }
      st.textContent = cssEntregadores(f);
    } catch (e) {}
  }
  // Trecho compartilhado (pagina e aba do Escravo): HTML das rotas da Saipos.
  // rotas: [{r, e, c, d, p:[{f,i,b,l,s}]}]  s: 0 aguardando, 1 saiu, 2 entregue
  // nomeEm: mapa persistente seq -> quando o nome do entregador apareceu
  // Regra do Breno (04/10): a rota some 30 s depois de aparecer o nome do entregador.
  function htmlRotas(rotas, agora, nomeEm, esc, horaDoTs) {
    var SOME_MS = 180000;   // 23.9: 3 min depois de alocada ao entregador
    var vis = [];
    (rotas || []).forEach(function (r) {
      if (!r || !r.p || !r.p.length) return;
      var comNome = !!(r.e || r.d);
      if (comNome) { if (!nomeEm[r.r]) nomeEm[r.r] = agora; if (agora - nomeEm[r.r] >= SOME_MS) return; }
      else if (nomeEm[r.r]) delete nomeEm[r.r];
      vis.push(r);
    });
    vis.sort(function (a, b) { return (a.c || 0) - (b.c || 0) || (a.r || 0) - (b.r || 0); });
    if (!vis.length) return '<div class="rvazio">Nenhuma rota aguardando entregador</div>';
    return vis.map(function (r) {
      var ha = Math.max(0, Math.round((agora - (r.c || agora)) / 60000));
      var st = (r.e || r.d)
        ? '<span class="st ok">🛵 ' + esc(r.e || 'entregador') + '<span class="ha">saiu ' + (r.d ? horaDoTs(r.d) : 'agora') + '</span></span>'
        : '<span class="st espera">aguardando entregador<span class="ha">' + (ha < 1 ? 'rota criada agora' : 'há ' + ha + ' min') + '</span></span>';
      var peds = r.p.map(function (p) {
        return '<div class="ped"><span class="n">' + esc(p.i || p.f || '') + '</span><span class="b">' + esc(p.b || '') + (p.l ? ' <small>' + esc(p.l) + '</small>' : '') + '</span></div>';
      }).join('');
      return '<div class="rota' + ((r.e || r.d) ? ' saiu' : '') + '"><div class="topo"><span class="nrota"><small>ROTA</small>' + esc(r.r) + '</span>' + st + '</div><div class="peds">' + peds + '</div></div>';
    }).join('');
  }

  function desenhar() {
    if (!sala) return;
    var lista = listaVisivel();
    var html = '';
    if (!lista.length) html += '<div class="vazio">Nenhum pedido no quadro.<br><small>Sala: ' + esc(sala) + '</small></div>';
    var nCol = (estado.col >= 1 && estado.col <= 4) ? estado.col : 3;
    // Tela de Entregadores: colunas pela LARGURA da tela, nao pela opcao do PC (3 a partir de 1560px)
    // 23.7: DIA = tela dividida (iFood 2 colunas | rotas da Saipos); rotas de ate 10 min atras valem
    var agoraR = agoraPC();
    var rotasVivas = (TELA_ENT && estado.dia && estado.rotas && agoraR - (estado.rotas.ts || 0) < 600000) ? (estado.rotas.lista || []) : null;
    var dividida = TELA_ENT && !!rotasVivas;
    if (TELA_ENT) {
      // 23.2: SEMPRE 4 colunas (a partir de 1150px); os tamanhos acompanham a largura da tela
      var lg = window.innerWidth;
      if (dividida) { nCol = lg >= 700 ? 2 : 1; aplicarEscalaEnt(Math.floor(lg / 2) - 8, nCol); }
      else { nCol = lg >= 1150 ? 4 : (lg >= 700 ? 2 : 1); aplicarEscalaEnt(lg, nCol); }
    }
    if (dividida) html += '<div class="meio">';
    html += (TELA_ENT ? '<div class="area"><svg class="lig"></svg>' : '') + '<div class="lista ' + (TELA_ENT ? 'e' : 'c') + nCol + '">';
    lista.forEach(function (r) {
      var fora = (r.e === 'rota' || r.e === 'fim' || r.e === 'cancelado');
      var logo = logoDaLoja(r.l);
      var iniciais = String(r.l || '?').split(/\s+/).map(function (p) { return p.charAt(0); }).join('').slice(0, 2).toUpperCase();
      // agendado (g = hora do preparo): o timer so comeca nessa hora
      var g = Number(r.g) || 0;
      var iniT = r.v ? Math.max(r.i || 0, g) : 0;
      var tags = (r.cw ? '<i class="tag cw">SITE</i>' : '') + (r.tb ? '<i class="tag tb">⚡ TURBO</i>' : '') + (r.rp ? '<i class="tag rp">🚀 RÁPIDA</i>' : '') +
                 (g ? '<i class="tag ag">AGENDADO' + (TELA_ENT ? '' : ' ' + esc(horaDoTs(g))) + '</i>' : '') + (r.md === 'retirada' ? '<i class="tag ret">RETIRADA</i>' : '');
      var aberta = !!abertos[r.n];
      var gAttr = (TELA_ENT && r.gr) ? ' data-g="' + esc(r.gr) + '"' : '';
      html += '<div class="linha' + (fora || r.z ? ' sumiu' : '') + (aberta ? ' aberta' : '') + '" data-n="' + esc(r.n) + '"' + gAttr + '>' +
              '<div class="num">' + esc(r.d || r.n) + '</div>' +
              '<div class="loja">' + (logo ? '<img src="' + esc(logo) + '" alt="">' : '<div class="sem">' + esc(iniciais) + '</div>') +
              '<div class="tx"><span>' + esc(r.l || '') + '</span>' + (tags ? '<div class="tg">' + tags + '</div>' : '') + '</div></div>' +
              '<div class="tm" data-ini="' + iniT + '" data-fim="' + (r.v && r.f ? r.f : 0) + '" data-meta="' + metaDe(r) + '" data-ag="' + (r.e === 'preparo' ? g : 0) + '" data-parado="' + ((r.e !== 'preparo' && !(r.v && r.f)) ? 1 : 0) + '"></div>' +
              '<div class="bt ' + classe(r.e) + '">' + rotulo(r.e) + '</div>' +
              ((!TELA_ENT && r.it && r.it.length) ? htmlItens(r.it) : '') + '</div>';
    });
    html += '</div>' + (TELA_ENT ? '</div>' : '');
    if (dividida) html += '<div class="rotasArea"><div class="rotasTit">🛵 ROTAS DA SAIPOS — aguardando entregador</div><div class="rotasLista">' + htmlRotas(rotasVivas, agoraR, rotasNomeEm, esc, horaDoTs) + '</div></div></div>';
    var corpo = elTela.querySelector('.corpo');
    if (!corpo.__toque) {
      corpo.__toque = 1;
      corpo.addEventListener('click', function (ev) {
        return;   // os itens ficam sempre a vista
      });
    }
    if (html !== ultimoHtml) {
      ultimoHtml = html; corpo.innerHTML = html;
      try {
        document.documentElement.classList.remove('rolar');
        var lst = corpo.querySelector('.lista');
        if (lst && lst.scrollWidth > lst.clientWidth + 4) document.documentElement.classList.add('rolar');
      } catch (e) {}
      if (TELA_ENT) ligarAgrupados();
    }
    desenharCabecalho();
    atualizarTimers();
  }
  function atualizarTimers() {
    var ag = agoraPC();
    var tms = elTela.querySelectorAll('.tm');
    for (var i = 0; i < tms.length; i++) {
      var el = tms[i];
      var ini = Number(el.getAttribute('data-ini')) || 0, fim = Number(el.getAttribute('data-fim')) || 0, txt, cls;
      var agd = Number(el.getAttribute('data-ag')) || 0;
      if (el.getAttribute('data-parado') === '1' && !fim) { txt = '✓'; cls = 'tm feito'; }
      else if (!fim && agd && ag < agd) { txt = (TELA_ENT ? '' : 'às ') + horaDoTs(agd); cls = 'tm espera'; }
      else if (!ini) { txt = ''; cls = 'tm nada'; }
      else if (fim && fim < ini) { txt = '✓'; cls = 'tm feito'; }
      else if (fim) {
        var levou = Math.max(0, Math.round((fim - ini) / 1000));
        txt = '✓ ' + (levou >= 60 ? Math.round(levou / 60) + ' min' : levou + ' seg');
        cls = 'tm feito';
      } else {
        var metaS = Number(el.getAttribute('data-meta')) || META_S;
        var rest = Math.round(metaS - (ag - ini) / 1000);
        if (rest === 0) rest = 0;
        txt = textoTimer(rest);
        cls = rest < 0 ? 'tm estourou' : 'tm';
      }
      if (el.textContent !== txt) el.textContent = txt;
      if (el.className !== cls) el.className = cls;
    }
  }

  // ---------------------------------------------------------------
  // TELA SEMPRE ACESA e TELA CHEIA (toque na tela)
  // ---------------------------------------------------------------
  var travaTela = null;
  function pedirTelaAcesa() {
    try {
      if ('wakeLock' in navigator && !travaTela) {
        navigator.wakeLock.request('screen').then(function (t) { travaTela = t; t.addEventListener('release', function () { travaTela = null; }); }).catch(function () {});
      }
    } catch (e) {}
  }
  var toques = 0, ultimoToque = 0;
  document.addEventListener('click', function (ev) {
    pedirTelaAcesa();
    if (!elConfig.hidden) return;
    try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); } catch (e) {}
    // 5 toques seguidos no relogio = volta para a configuracao
    if (ev.target && ev.target.classList && ev.target.classList.contains('relogio')) {
      var ag = Date.now();
      toques = (ag - ultimoToque < 1500) ? toques + 1 : 1;
      ultimoToque = ag;
      if (toques >= 5) { toques = 0; abrirConfig(); }
    }
  });

  // ---------------------------------------------------------------
  // INICIO
  // ---------------------------------------------------------------
  elTela.innerHTML = '<div class="cab"></div><div class="corpo" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>' +
                     '<div class="rodape"><span>Ordem pela hora do aceite. Timer de 7 min desde que o pedido entrou no painel; vermelho = passou do tempo.</span><span class="salaTxt"></span></div>';
  // a lista precisa ocupar a altura toda para as colunas funcionarem
  var estiloCorpo = document.createElement('style');
  estiloCorpo.textContent = '.corpo .lista{height:100%}.corpo .area{height:100%}.corpo .meio{height:100%}';
  document.head.appendChild(estiloCorpo);
  if (!sala) { abrirConfig(); return; }
  elTela.querySelector('.salaTxt').textContent = 'sala: ' + sala;
  if (TELA_ENT) { document.body.className = 'ent'; try { document.title = '🛵 Tela de Entregadores'; } catch (e) {} }
  else { try { document.title = '🍳 KDS'; } catch (e) {} }
  desenhar();
  SERVIDORES.forEach(conectar);
  setInterval(atualizarTimers, 1000);
  setInterval(desenhar, 5000);
  pedirTelaAcesa();
  // expoe para testes
  window.__painel = { aplicar: aplicar, estado: estado, textoTimer: textoTimer, desenhar: desenhar };
})();
</script>
</body>
</html>
